<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>micro-prolog</title>

    <style>
        html, body {
            display: block;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            box-sizing: border-box;
        }

        body {
            display: flex;
            padding: 5px;
            align-items: stretch;
            justify-content: space-between;
            flex-direction: row;
        }

        textarea, #code {
            font: 14pt monospace;
            box-sizing: border-box;
            flex-grow: 1;
        }

        textarea {
            display: block;
            padding: 5px;
        }

        #code {
            max-width: 50%;
            margin-right: 5px;
            border: 1px solid #767676;
            border-radius: 2px;
        }

        .control-panel {
            display: flex;
            max-width: 50%;
            align-items: stretch;
            justify-content: space-between;
            flex-direction: column;
            flex-grow: 1;
        }

        .answers {
            max-height: 47%;
            overflow-y: auto;
            margin-top: 5px;

            font: 14pt monospace;
            line-break: anywhere;

            flex-grow: 1;
        }

        .false {
            color: red;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        button {
            display: block;
            width: 100%;
            min-height: 30px;
            max-height: 30px;
            margin-top: 5px;
        }

        .controls-row {
            display: flex;
            gap: 5px;
        }

        .controls-row select {
            flex: none;
            min-width: 100px;
            min-height: 30px;
            max-height: 30px;
            margin-top: 0;
        }

        .controls-row button {
            flex: 1;
            min-height: 30px;
            max-height: 30px;
            margin-top: 0;
        }

        select {
            padding: 2px 5px;
        }
    </style>
</head>

<body>

<textarea id="code"></textarea>

<div class="control-panel">
    <textarea id="print" disabled></textarea>

    <div class="answers">
        Answers:

        <ul id="answers-dfs"></ul>
        <ul id="answers-interleaving" class="hidden"></ul>
    </div>

    <div class="controls-row">
        <select id="strategy">
            <option value="dfs" selected>DFS</option>
            <option value="interleaving">Interleaving</option>
        </select>
        <button id="run">Run</button>
    </div>
</div>

<script type="text/javascript" src="./script.js"></script>

</body>
</html>
